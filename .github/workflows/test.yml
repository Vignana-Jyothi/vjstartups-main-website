name: Tests

# Runs the backend and frontend unit tests on every pull request that touches them.
# Both suites use Node's built-in test runner and both need their dependencies installed
# (the backend's route modules load express; the frontend's test runner bundles with esbuild,
# which ships with Vite). Neither needs a database. Runs on GitHub's own runners, not the
# self-hosted deploy machines.

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  backend:
    name: npm test (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No database, but the route modules some tests load (stats-api) require express at the top,
      # so the backend's dependencies must be installed. There is no lockfile, so `npm ci` cannot be used.
      - name: Install the backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Run the backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: npm test (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # There is no package-lock.json in frontend/ (only a Bun lockfile), so `npm ci`
      # cannot be used. The tests import npm packages such as axios.
      - name: Install the frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run the frontend tests
        working-directory: frontend
        run: npm test
