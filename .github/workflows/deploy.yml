name: Deploy Applications

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    name: Deploy to Environment
    runs-on: ${{ github.ref == 'refs/heads/main' && 'gamma' || 'dev-ai' }}
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'vj-production' || 'vj-development' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://www.vjstartup.com' || 'https://dev-vj.vjstartup.com' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file for backend
        run: |
          # No DATABASE_URL here: docker-compose.yml sets the database connection
          # itself (from the PLANE_DATABASE_URL secret, see the next step) and
          # would override anything written to this file.
          cat << 'EOF' > backend/.env
          PORT=${{ secrets.PORT || 6220 }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
          PLANE_API_URL=${{ vars.PLANE_API_URL || 'https://vjos.vjstartup.com' }}
          PLANE_INTERNAL_TOKEN=${{ secrets.PLANE_INTERNAL_TOKEN }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF
          if [ -z "${{ secrets.PLANE_INTERNAL_TOKEN }}" ]; then
            echo "::warning::PLANE_INTERNAL_TOKEN secret is not set - the internal auth bridge to Plane (Google login user creation, admin proxy, startup project provisioning) will not work. It must exactly match PUBLIC_SITE_INTERNAL_TOKEN in Plane's own deploy secrets."
          fi

          # Optional settings - only written when the repository variable is set,
          # so the application defaults apply otherwise (backend/config/appConfig.js).
          if [ -n "${INSTITUTIONAL_EMAIL_DOMAINS}" ]; then
            echo "INSTITUTIONAL_EMAIL_DOMAINS=${INSTITUTIONAL_EMAIL_DOMAINS}" >> backend/.env
          fi
          if [ -n "${CORS_ORIGINS}" ]; then
            echo "CORS_ORIGINS=${CORS_ORIGINS}" >> backend/.env
          fi
        env:
          INSTITUTIONAL_EMAIL_DOMAINS: ${{ vars.INSTITUTIONAL_EMAIL_DOMAINS }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}

      - name: Set the database connection for docker compose
        env:
          PLANE_DATABASE_URL: ${{ secrets.PLANE_DATABASE_URL }}
        run: |
          # docker-compose.yml reads PLANE_DATABASE_URL from a .env file beside it
          # (gitignored). Unset means "use the built-in default", so remove any
          # stale file rather than leave an old value behind.
          if [ -n "$PLANE_DATABASE_URL" ]; then
            printf "PLANE_DATABASE_URL='%s'\n" "$PLANE_DATABASE_URL" > .env
          else
            rm -f .env
            echo "::warning::PLANE_DATABASE_URL secret is not set - using the built-in default connection from docker-compose.yml. Set it when Plane's database credentials change."
          fi

      - name: Create .env file for frontend
        run: |
          cat << 'EOF' > frontend/.env
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT=${{ secrets.VITE_GOOGLE_CLIENT }}
          VITE_AUTH_URL=${{ secrets.VITE_AUTH_URL }}
          VITE_DEBUG_MODE=${{ secrets.VITE_DEBUG_MODE || 'false' }}
          VITE_GOOGLE_SPREADSHEET_ID=${{ secrets.VITE_GOOGLE_SPREADSHEET_ID }}
          VITE_GOOGLE_SHEETS_API_KEY=${{ secrets.VITE_GOOGLE_SHEETS_API_KEY }}
          EOF

      - name: Deploy with Docker Compose
        run: |
          docker compose down
          docker compose up -d --build

      # The backend exits when it cannot reach its database, so a wrong or unreachable
      # DATABASE_URL shows up as a restart loop, not a clear error. Check the network path
      # first, in a one-off container (unaffected by that loop) with exactly the same
      # DATABASE_URL and host mapping, and say why it failed. Only host and port are printed.
      - name: Check the database is reachable
        run: |
          set +e
          out=$(docker compose run --rm --no-deps -T backend node scripts/check-db.js 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out" | grep -E '^(host=|database port|NOT )' || printf '%s\n' "$out" | tail -n 5
          if [ "$rc" -ne 0 ]; then
            host=$(printf '%s\n' "$out" | sed -n 's/^host=\([^ ]*\).*/\1/p')
            echo "::error::The backend cannot reach its database (see the line above). This machine's own addresses and route follow, to compare with the database host's."
            echo "this machine: $(hostname) $(hostname -I 2>/dev/null)"
            if [ -n "$host" ]; then ip route get "$host" 2>&1 || true; fi
            exit "$rc"
          fi

      # The site's own tables get no Prisma migration history on this database, so changes that
      # add tables ship as SQL that is safe to re-run and are applied here, inside the backend
      # container (which already points at the shared Plane database). Existing rows are never
      # overwritten.
      #
      # This uses scripts/apply-sql.js (the Prisma client) rather than `npx prisma db execute`:
      # the CLI plus its schema engine on top of the running server was being killed with exit
      # 137 on the production host. If it still fails, the container state and its recent logs
      # (emails masked - this repo's logs are public) are printed so the cause is visible.
      #
      # The files are listed explicitly, oldest first, on purpose: prisma/migrations/ also holds
      # older Prisma-generated folders (a legacy "users" table among them) that must never be
      # run against this database. To add a change, append its file here in the same PR that
      # adds it. Every file must be safe to re-run (IF NOT EXISTS, ON CONFLICT DO NOTHING).
      - name: Apply site database changes
        run: |
          set +e
          docker compose exec -T backend node scripts/apply-sql.js \
            prisma/migrations/20260929000000_add_success_stories/migration.sql \
            prisma/migrations/20260930000000_add_site_content/migration.sql
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Applying the site database changes failed (exit $rc). Container state and recent logs follow."
            docker compose ps backend || true
            docker compose logs --tail 40 backend 2>&1 \
              | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g' || true
            free -m || true
            exit "$rc"
          fi
