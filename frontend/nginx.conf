server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page itself is always rechecked, so a deploy shows up on the next visit instead of
    # whenever the browser's heuristic cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's build output has a content hash in every file name, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Files in public/ keep their names across deploys (favicon, touch icon, share image, fonts,
    # story photos): cache them for a day, not a year, so a changed logo or photo reaches people.
    location ~* \.(?:css|js|jpg|jpeg|svg|png|webp|avif|ico|woff2?|eot|ttf)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    error_page 404 /index.html;
}
