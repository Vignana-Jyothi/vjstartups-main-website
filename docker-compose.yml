version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3005:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "6220:6220"
    # Everything deploy.yml writes to backend/.env (PLANE_INTERNAL_TOKEN,
    # GOOGLE_CLIENT_ID, ADMIN_EMAILS, CLOUDINARY_*, PLANE_API_URL) was never
    # actually reaching the container - there was no env_file here, so it
    # relied entirely on the Dockerfile's `COPY . .` baking .env into the
    # image at build time, which is both fragile (depends on build-cache
    # behavior) and bad practice (secrets end up in image layers/history).
    # Matches Plane's own docker-compose.yml pattern for its api service.
    env_file:
      - ./backend/.env
    environment:
      # Must point at the SAME database Plane's own Django stack uses (the
      # "plane" db exposed on host port 5434 by Plane's own docker-compose -
      # see deploy-plane.yml). Previously pointed at "vj", a separate,
      # unrelated database left over from before backend 2's tables were
      # merged into Plane's own Postgres (see docs/vj-startups/production_db_merge_runbook.md) -
      # every cross-service feature (admin proxy, startup provisioning,
      # shared users table) silently had nothing to read/write against.
      - DATABASE_URL=postgresql://plane:plane@host.docker.internal:5434/plane
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always


