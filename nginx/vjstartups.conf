# ==============================================================================
# Nginx Configuration for VJ Startups Deployment on College Server
# Subdomains:
#  - admin.vjstartups.com  -> Admin Panel SPA
#  - plane.vjstartups.com  -> Plane Task Management SPA
#  - hub.vjstartup.com     -> Main User App SPA
#  - api.vjstartups.com    -> Express Backend API (Port 6220)
# ==============================================================================

# 1. ADMIN PANEL (admin.vjstartups.com)
server {
    listen 80;
    server_name admin.vjstartups.com;

    # Replace with absolute path to admin build output directory
    root /var/www/vj/admin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}

# 2. PLANE TASK BOARD (plane.vjstartups.com)
server {
    listen 80;
    server_name plane.vjstartups.com;

    # Replace with absolute path to plane build output directory
    root /var/www/vj/plane/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}

# 3. MAIN USER APP (hub.vjstartup.com or vjstartups.com)
server {
    listen 80;
    server_name hub.vjstartup.com vjstartups.com www.vjstartups.com;

    root /var/www/vj/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 4. BACKEND API PROXY (api.vjstartups.com or port proxy)
server {
    listen 80;
    server_name api.vjstartups.com;

    location / {
        proxy_pass http://127.0.0.1:6220;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
